<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه نوین نظارت</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#f1f4f8;color:#202b3c}
header{background:#14243a;color:white;padding:24px 16px;text-align:center}
main{max-width:700px;margin:24px auto;padding:0 14px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px}
h2{font-size:18px}
label{display:block;margin:14px 0 7px}
input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5e0;border-radius:8px;font:inherit}
button{width:100%;margin-top:16px;background:#d62839;color:white;border:0;border-radius:8px;padding:13px;font:inherit}
.note{font-size:13px;color:#64748b;line-height:2}
</style>
</head>
<body>
<header>
<h1>نوین نظارت</h1>
<p>سامانه مدیریت مشتریان</p>
</header>
<main>
<section class="card">
<h2>ثبت مشتری جدید</h2>
<form id="form">
<label>نام و نام خانوادگی</label>
<input id="name" required>
<label>شماره تماس</label>
<input id="phone" type="tel" required>
<label>آدرس</label>
<textarea id="address" rows="2"></textarea>
<label>یادداشت</label>
<textarea id="note" rows="2"></textarea>
<button type="submit">ذخیره مشتری</button>
</form>
<p id="status" role="status"></p>
<p class="note">برای ذخیره اطلاعات، اتصال و مجوزهای پایگاه داده باید تنظیم شده باشند.</p>
</section>
<section class="card">
<h2>مشتریان ثبت‌شده</h2>
<button id="refresh" type="button">بارگذاری مشتریان</button>
<div id="list"></div>
</section>
</main>
<script>
const SUPABASE_URL = "https://lnusanwwloysejorjjxr.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_oSVp5sKrHc51kLCB_8pNFA_f9bA8-Sf";
const statusBox = document.getElementById("status");
const list = document.getElementById("list");

async function api(path, options = {}) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      ...options.headers
    }
  });
  const text = await response.text();
  if (!response.ok) throw new Error(text || response.status);
  return text ? JSON.parse(text) : null;
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  statusBox.textContent = "در حال ذخیره...";
  try {
    await api("customers", {
      method: "POST",
      headers: {"Prefer":"return=minimal"},
      body: JSON.stringify({
        full_name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        note: document.getElementById("note").value.trim()
      })
    });
    statusBox.textContent = "مشتری با موفقیت ذخیره شد.";
    e.target.reset();
    loadCustomers();
  } catch (err) {
    statusBox.textContent = "خطا در ذخیره‌سازی؛ تنظیمات اتصال یا مجوز جدول را بررسی کنید.";
    console.error(err);
  }
});

async function loadCustomers() {
  list.textContent = "در حال بارگذاری...";
  try {
    const rows = await api("customers?select=id,full_name,phone,address,note,created_at&order=created_at.desc");
    list.replaceChildren();
    if (!rows.length) {
      list.textContent = "هنوز مشتری‌ای ثبت نشده است.";
      return;
    }
    rows.forEach((c, i) => {
      const item = document.createElement("div");
      item.style.cssText = "padding:12px 0;border-bottom:1px solid #eee;line-height:2";
      item.textContent = `${i+1}. ${c.full_name} | ${c.phone} | ${c.address || "بدون آدرس"}`;
      list.appendChild(item);
    });
  } catch (err) {
    list.textContent = "بارگذاری انجام نشد؛ اتصال و مجوزهای جدول را بررسی کنید.";
    console.error(err);
  }
}
document.getElementById("refresh").addEventListener("click", loadCustomers);
</script>
</body>
</html>
